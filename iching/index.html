<!-- Starfield canvas init -->
<script>
(function() {
  const canvas = document.getElementById('iching-canvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const GOLD = 'rgba(201,168,76,';
  const WHITE = 'rgba(220,215,200,';
  let stars = [];

  function resize() {
    canvas.width  = window.innerWidth;
    canvas.height = window.innerHeight;
  }

  function initStars() {
    stars = Array.from({length: 180}, () => ({
      x: Math.random(),
      y: Math.random(),
      r: Math.random() * 1.2 + 0.2,
      a: Math.random(),
      s: (Math.random() * 0.4 + 0.1) * 0.001,
      gold: Math.random() < 0.15
    }));
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const W = canvas.width, H = canvas.height;
    stars.forEach(star => {
      star.a += star.s;
      if (star.a > 1) star.a = 0;
      const alpha = Math.abs(Math.sin(star.a * Math.PI));
      const col   = star.gold ? GOLD : WHITE;
      ctx.beginPath();
      ctx.arc(star.x * W, star.y * H, star.r, 0, Math.PI * 2);
      ctx.fillStyle = col + alpha.toFixed(2) + ')';
      ctx.fill();
    });
    requestAnimationFrame(draw);
  }

  resize();
  initStars();
  draw();
  window.addEventListener('resize', resize);
})();
</script>
