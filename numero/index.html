      border-radius: 4px;
      cursor: pointer;
      font-family: inherit;
      font-size: inherit;
      letter-spacing: inherit;
      transition: all 0.2s;
    }

      border-color: rgba(201,168,76,0.8);
      color: rgba(201,168,76,1);
    }
    .nlang-btn:hover:not(.active) {
      border-color: rgba(201,168,76,0.5);

<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-5FG6N9KV" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>

<canvas id="sky-canvas"></canvas>

<div class="container">
  <div class="num-header">
    <a href="../index.html" class="back-btn" data-cs="← Zpět do Oracoolia" data-en="← Back to Oracoolio">← Zpět do Oracoolia</a>
    <div class="num-lang-switch">
      <button onclick="setLang('cs')" id="btn-lang-cs" class="nlang-btn active">CS</button>
      <span class="num-lang-sep">|</span>
      <button onclick="setLang('en')" id="btn-lang-en" class="nlang-btn">EN</button>
    </div>
  </div>

  <div class="page-title">
    <h1 data-cs="Oracoolio Numero" data-en="Oracoolio Numero">Oracoolio Numero</h1>
    <p class="subtitle" data-cs="Kompletní numerologický rozbor vaší duše" data-en="Complete numerological analysis of your soul">Kompletní numerologický rozbor vaší duše</p>
    <div class="title-divider"></div>
  </div>

  <div class="card">
    <div class="form-section-label" data-cs="Vaše identita" data-en="Your identity">Vaše identita</div>
    <form id="numForm">
      <div class="form-group">
        <label for="fullName" data-cs="Celé jméno" data-en="Full name">Celé jméno</label>
        <input type="text" id="fullName" value="Aurelie Nováková" required>
      </div>
      <div class="form-group">
        <label for="birthDate" data-cs="Datum narození" data-en="Date of birth">Datum narození</label>
        <input type="date" id="birthDate" value="1990-10-28" required>
      </div>

      <div class="partner-section">
        <div class="form-section-label" style="margin-top: 4px;">
          <span data-cs="Partnerská shoda" data-en="Partner compatibility">Partnerská shoda</span>
          <span style="color: var(--text-dim); font-size: 0.6rem; font-family: 'Crimson Pro', serif; text-transform: none; letter-spacing: 0; font-style: italic; font-weight: 300;">
            (<span data-cs="volitelné" data-en="optional">volitelné</span>)
          </span>
        </div>
        <div class="form-group">
          <label for="partnerName" data-cs="Jméno partnera" data-en="Partner's name">Jméno partnera</label>
          <input type="text" id="partnerName"
                 data-placeholder-cs="Např. Petr Novák"
                 data-placeholder-en="E.g. John Smith"
                 placeholder="Např. Petr Novák">
        </div>
        <div class="form-group">
          <label for="partnerDate" data-cs="Datum narození partnera" data-en="Partner's date of birth">Datum narození partnera</label>
          <input type="date" id="partnerDate">
        </div>
      </div>

      <div class="settings-box">
        <strong data-cs="Metoda životního čísla" data-en="Life path method">Metoda životního čísla</strong>
        <label><input type="radio" name="lifePathMethod" value="linear" id="lpLin" checked>
          <span data-cs="Lineární" data-en="Linear">Lineární</span></label>
        <label><input type="radio" name="lifePathMethod" value="pythagorean" id="lpPyt">
          <span data-cs="Pythagorejská" data-en="Pythagorean">Pythagorejská</span></label>
        <br><br>
        <strong data-cs="Systém jména" data-en="Name system">Systém jména</strong>
        <label><input type="radio" name="nameMethod" value="pythagorean" id="namePyt" checked>
          <span data-cs="Pythagorejská (1–9)" data-en="Pythagorean (1–9)">Pythagorejská (1–9)</span></label>
        <label><input type="radio" name="nameMethod" value="chaldean" id="nameChal">
          <span data-cs="Chaldejská (1–8)" data-en="Chaldean (1–8)">Chaldejská (1–8)</span></label>
      </div>
      <button type="submit" data-cs="✦ Odhalit rozbor ✦" data-en="✦ Reveal reading ✦">✦ Odhalit rozbor ✦</button>
    </form>
  </div>

  <div id="results">
    <div id="outputArea"></div>
  </div>


</div>

<script src="numero.js" defer></script>
<script>
// ── Lokalizace ────────────────────────────────────────────
function setLang(lang) {
  if (typeof NUMERO_LANG !== 'undefined') NUMERO_LANG = lang;
  document.documentElement.lang = lang;
  document.title = lang === 'en' ? 'Numero — Numerological Reading | Oracoolio' : 'Numero — Numerologický rozbor | Oracoolio';
  document.getElementById('btn-lang-cs').style.color = lang === 'cs' ? 'rgba(201,168,76,1)' : 'rgba(201,168,76,0.3)';
  document.getElementById('btn-lang-cs').style.borderColor = lang === 'cs' ? 'rgba(201,168,76,0.8)' : 'rgba(201,168,76,0.2)';
  document.getElementById('btn-lang-en').style.color = lang === 'en' ? 'rgba(201,168,76,1)' : 'rgba(201,168,76,0.3)';
  document.getElementById('btn-lang-en').style.borderColor = lang === 'en' ? 'rgba(201,168,76,0.8)' : 'rgba(201,168,76,0.2)';
  document.querySelectorAll('[data-cs]').forEach(el => {
    const val = lang === 'en' ? el.dataset.en : el.dataset.cs;
    if (!val) return;
    if (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA') {
      el.placeholder = val;
    } else if (el.tagName === 'BUTTON' && el.type === 'submit') {
      el.textContent = val;
    } else {
      el.textContent = val;
    }
  });
  // Placeholder inputs with separate data attrs
  document.querySelectorAll('[data-placeholder-cs]').forEach(el => {
    el.placeholder = lang === 'en' ? (el.dataset.placeholderEn || el.dataset.placeholderCs) : el.dataset.placeholderCs;
  });
}
</script>
