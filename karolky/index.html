<body>
<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-5FG6N9KV" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
    <main id="karolky-section" class="hidden">

        <button class="back-btn" onclick="window.location.href='../index.html'">← Zpět do Oracoolia</button>

        <!-- Horní lišta s názvem, HUD a tlačítkem nová hra -->
        <header id="kp-header">
            <h1>Karolky II — Double Klondike</h1>
            <div id="kp-hud">
                <span class="kp-pill">Kolo <span id="kp-pass">1</span>/3</span>
                <span class="kp-pill">Po <span id="kp-draw">3</span></span>
                <div id="kp-dots">
                    <div class="kp-dot kp-dot-active" id="kp-d1"></div>
                    <div class="kp-dot" id="kp-d2"></div>
                    <div class="kp-dot" id="kp-d3"></div>
                </div>
                <span class="kp-pill">Stoh: <span id="kp-stock-cnt">0</span></span>
                <button class="kp-new-btn" onclick="kpNewGame()">✦ Nová hra</button>
            </div>
        </header>

        <!-- Info bar — zobrazí se při tap-výběru karty -->
        <div id="kp-infobar" class="kp-infobar-hidden">
            <div class="kp-info-left">
                <span id="kp-info-txt"></span>
                <span id="kp-info-sub"></span>
            </div>
            <div class="kp-info-right">
                <span class="kp-info-hint">Klepněte na cíl</span>
                <button class="kp-cancel-btn" onclick="kpClearSel()">✕ Zrušit</button>
            </div>
        </div>

        <!-- Herní plocha -->
        <div id="kp-game">

            <!-- TOP ROW: stock | waste | spacer | 8 foundations (11 sloupců) -->
            <div class="kp-grid kp-grid-11">
                <div class="kp-slot kp-stock-slot" id="kp-stock" onclick="kpClickStock()">
                    <span id="kp-recycle"></span>
                </div>
                <div class="kp-slot" id="kp-waste"></div>
                <div class="kp-spacer"></div>
                <div class="kp-slot kp-foundation" id="kp-f0" data-suit="hearts"   data-color="red"   data-sym="♥"></div>
                <div class="kp-slot kp-foundation" id="kp-f1" data-suit="hearts"   data-color="red"   data-sym="♥"></div>
                <div class="kp-slot kp-foundation" id="kp-f2" data-suit="diamonds" data-color="red"   data-sym="♦"></div>
                <div class="kp-slot kp-foundation" id="kp-f3" data-suit="diamonds" data-color="red"   data-sym="♦"></div>
                <div class="kp-slot kp-foundation" id="kp-f4" data-suit="clubs"    data-color="black" data-sym="♣"></div>
                <div class="kp-slot kp-foundation" id="kp-f5" data-suit="clubs"    data-color="black" data-sym="♣"></div>
                <div class="kp-slot kp-foundation" id="kp-f6" data-suit="spades"   data-color="black" data-sym="♠"></div>
                <div class="kp-slot kp-foundation" id="kp-f7" data-suit="spades"   data-color="black" data-sym="♠"></div>
            </div>

            <!-- TABLEAU ROW: 8 sloupců -->
            <div class="kp-grid kp-grid-8">
                <div class="kp-slot kp-tab" id="kp-t0"></div>
                <div class="kp-slot kp-tab" id="kp-t1"></div>
                <div class="kp-slot kp-tab" id="kp-t2"></div>
                <div class="kp-slot kp-tab" id="kp-t3"></div>
                <div class="kp-slot kp-tab" id="kp-t4"></div>
                <div class="kp-slot kp-tab" id="kp-t5"></div>
                <div class="kp-slot kp-tab" id="kp-t6"></div>
                <div class="kp-slot kp-tab" id="kp-t7"></div>
            </div>

        </div><!-- /#kp-game -->

        <!-- Win / Lose overlay -->
        <div id="kp-overlay">
            <div id="kp-overlay-box">
                <div id="kp-ov-icon"></div>
                <h2 id="kp-ov-title"></h2>
                <p id="kp-ov-msg"></p>
                <button class="kp-obtn kp-obtn-gold" onclick="kpNewGame();kpCloseOverlay()">✦ Nová hra</button>
                <button class="kp-obtn kp-obtn-ghost" onclick="kpCloseOverlay()">Zavřít</button>
            </div>
        </div>

    </main><!-- /#karolky-section -->
  <script src="karolky.js"></script>
</body>
</html>
